<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Verification Test</title>

  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input,
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Email Verify Test</h2>

    <input
      type="email"
      id="email"
      placeholder="Enter Email"
    />

    <button onclick="sendEmail()">
      Send Verification
    </button>

    <div id="message"></div>
  </div>

  <script>
    async function sendEmail() {

      const email = document.getElementById("email").value;

      const response = await fetch("/send-verification", {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
        },

        body: JSON.stringify({ email }),
      });

      const data = await response.json();

      document.getElementById("message").innerText =
        data.message;
    }
  </script>

</body>
</html>
